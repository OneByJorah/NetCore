[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nethermind"
version = "0.1.0"
description = "AI-powered network switch management — multi-vendor SSH and serial access, 50+ Jinja2 templates, an AI agent, and security auditing for mixed network fleets."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "OneByJorah", email = "info@jorahone.com"}]
keywords = ["network", "switch", "cisco", "juniper", "arista", "aruba", "fastapi", "netmiko", "ssh", "config-management", "network-engineering", "ai", "openai", "nextjs", "electron", "jorahone"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "netmiko>=4.3",
    "pyserial>=3.5",
    "jinja2>=3.1",
    "pydantic>=2.0",
    "openai>=1.0",
    "python-multipart>=0.0",
    "aiofiles>=23.0",
    "pytest>=8.0",
]

[project.optional-dependencies]
dev = ["ruff", "pytest", "pytest-asyncio"]

[project.urls]
Homepage = "https://github.com/OneByJorah/NetCore"
Repository = "https://github.com/OneByJorah/NetCore"
Issues = "https://github.com/OneByJorah/NetCore/issues"
Documentation = "https://github.com/OneByJorah/NetCore#readme"

[tool.setuptools.packages.find]
include = ["backend*"]
